<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trivia — Play solo trivia runs, practice geography flags & capitals, or compete live in real-time multiplayer rooms."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Trivia — Solo, Practice &amp; Live Multiplayer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Dev helper: when opened via VS Code Live Server (static file server) instead of Vite,
      // automatically forward to the local Vite + Cloudflare dev server on port 5174.
      (function () {
        var isRawViteEntry = !!document.querySelector('script[src="/src/main.tsx"]');
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isRawViteEntry || !isLocal || location.port === '5174') return;

        var relPath = location.pathname
          .replace(/^\/trivia\/?/i, '/')
          .replace(/\/index\.html$/i, '/');
        if (!relPath.startsWith('/')) relPath = '/' + relPath;
        var devOrigin = 'http://localhost:5174';
        var devUrl = devOrigin + relPath;
        fetch(devOrigin + '/api/health')
          .then(function (r) {
            if (r.ok) location.replace(devUrl);
            else throw new Error('not ready');
          })
          .catch(function () {
            document.body.style.cssText =
              'margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#12111a;color:#f2effa;font-family:system-ui,sans-serif;padding:24px;';
            document.getElementById('root').innerHTML =
              '<div style="max-width:480px;background:#1a1826;border:1px solid #312d47;border-radius:16px;padding:24px;line-height:1.6;">' +
              '<h2 style="margin:0 0 8px;">Trivia Dev Server Not Running</h2>' +
              '<p style="margin:0 0 14px;color:#a7a1be;">Trivia is a React + Cloudflare Durable Objects app, so VS Code Live Server cannot compile <code>.tsx</code> files directly.</p>' +
              '<p style="margin:0 0 14px;">Run this command in your terminal, then click Retry:</p>' +
              '<pre style="background:#12111a;padding:10px 12px;border-radius:8px;overflow:auto;color:#b99bff;">npm run dev</pre>' +
              '<div style="display:flex;gap:10px;margin-top:16px;">' +
              '<button onclick="location.reload()" style="padding:9px 14px;border-radius:9px;border:none;background:#b99bff;color:#140f24;font-weight:700;cursor:pointer;">Retry Connection</button>' +
              '<a href="https://blakepember.net/" style="padding:9px 14px;border-radius:9px;border:1px solid #443e63;color:#f2effa;text-decoration:none;font-weight:600;">← Back to Portfolio</a>' +
              '</div></div>';
          });
      })();
    </script>
  </body>
</html>
